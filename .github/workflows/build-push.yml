# Build the OCI image for mcl-mail and push to the registry.
#
# TWO CHANNELS, AND A TAG PUSH MUST NOT TOUCH :latest.
#
#   push to main : publishes :latest        <- the tip of main, deploys nothing
#   push of v*   : publishes :<semver> ONLY <- a release
#
# The fleet runs a release BY DIGEST: macula-fleet pins the digest a v* tag
# produced and reconciles every box to it, so a new image reaches a box only
# when its pin is bumped. :latest is a moving label for trying the tip of main;
# nothing on the fleet follows it. A tag that also moved :latest would make that
# label jump to a release, so the two stay apart.
#
# NO PATH FILTER, ON PURPOSE. A docs-only push should not rebuild :latest and
# restart every box, but `paths-ignore' cannot be trusted with that: on the push
# that CREATES a branch GitHub evaluates it on the head commit alone, so a first
# push ending in a README edit silently built no image. scripts/is_image_push.sh
# decides from the pushed range instead, and builds whenever it cannot tell.
# If an image is ever missing anyway, run this workflow by hand.
#
# NOTE ON PUSHING THIS FILE. An HTTPS push that creates or updates anything under
# .github/workflows/ needs a token carrying the `workflow' scope, and the error
# names the FILE rather than the missing scope. Use an SSH remote and the problem
# does not arise.

name: build-and-push

on:
  push:
    branches: [main]
    tags:     ['v*']
  workflow_dispatch:

# ONE IMAGE BUILD IN FLIGHT PER REF. Every push to main builds and pushes
# :latest; without this, three quick commits run three builds that finish in
# whatever order the runners please, and :latest ends up being whichever
# finished LAST, not whichever was pushed last. A sibling service hit exactly
# that live, when boxes still followed :latest.
concurrency:
  group: build-and-push-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      # The whole history, so the gate below can diff the pushed range.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Does this push need an image?
        id: gate
        run: scripts/is_image_push.sh "${{ github.event.before }}" "${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Log in to the registry
        if: steps.gate.outputs.build == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Emits the COMPLETE tag list, so the condition governs all of it.
      - name: Set tags
        if: steps.gate.outputs.build == 'true'
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tags=ghcr.io/macula-services/mcl-mail:${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=ghcr.io/macula-services/mcl-mail:latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        if: steps.gate.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: true
          tags: ${{ steps.tag.outputs.tags }}
          # The commit the image was built from, readable from the image itself.
          build-args: |
            REVISION=${{ github.sha }}

# Structural lint, unit tests and dialyzer, in the same digest-pinned build
# image the Containerfile's builder uses.
#
# macula's NIFs (the QUIC one, macula_cbor_nif and the crypto/ucan/did/mri
# NIFs beside it) always build from source, so the image carries Rust. rocksdb
# is NOT compiled: the override in rebar.config links the image's librocksdb
# 11.1.2 instead of the copy the binding bundles.

name: lint-and-test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    container:
      # ⚠ THE SAME DIGEST-PINNED BUILD IMAGE AS THE Containerfile: OTP 28.4.3
      # on an OpenSSL with ML-DSA, rebar3, Rust, cmake, and librocksdb 11.1.2
      # with its codec libraries for the system-rocksdb override. Its tag
      # names a date, not a release, so the step below refuses anything but
      # 28.4.3. mcl_mail_service_tests guards this pin and that check.
      image: ghcr.io/macula-io/macula-ci-otp-rocksdb@sha256:da4ea316b91f4f29efc8036fa9d95a3b1f3efde8b85cb5997780f140e0f2f6d8
    steps:
      - uses: actions/checkout@v4
      - name: Verify the toolchain is the one we think it is
        run: |
          openssl version
          rebar3 version
          erl -noshell -eval '
            Otp = string:trim(element(2, file:read_file(filename:join([code:root_dir(), "releases", erlang:system_info(otp_release), "OTP_VERSION"])))),
            Mldsa = lists:member(mldsa87, crypto:supports(public_keys)),
            io:format("OTP ~s, mldsa87 ~p~n", [Otp, Mldsa]),
            case {Otp, Mldsa} of
                {<<"28.4.3">>, true} -> halt(0);
                _                    -> halt(1)
            end.'
      - run: rebar3 lint
      - run: rebar3 eunit
      # The responders hand payload terms to the CMD desks and the read model
      # to barrel_docdb; dialyzer is what notices a contract drifting between
      # them, so it gates alongside the tests.
      - run: rebar3 dialyzer
